name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint with ruff
        run: |
          cd backend
          ruff check .
      - name: Type check with mypy
        run: |
          cd backend
          mypy app/ --ignore-missing-imports

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_trader_risk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/ -v --tb=short -x
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_trader_risk
          DATABASE_URL_SYNC: postgresql://test_user:test_password@localhost:5432/test_trader_risk
          API_KEY: test-api-key
      - name: Run property-based tests
        run: |
          cd backend
          pytest tests/test_property_based.py -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_trader_risk
          DATABASE_URL_SYNC: postgresql://test_user:test_password@localhost:5432/test_trader_risk
          API_KEY: test-api-key

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Lint
        run: |
          cd frontend
          npx eslint src/ --ext .ts,.tsx || true
      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t trader-risk-backend ./backend
      - name: Build frontend image
        run: docker build -t trader-risk-frontend ./frontend
      - name: Test compose config
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_A_STRONG_PASSWORD/testpass123/g' .env
          sed -i 's/CHANGE_ME_TO_A_RANDOM_SECRET/test-key/g' .env
          sed -i 's/CHANGE_ME_TO_MATCH_BACKEND_API_KEY/test-key/g' .env
          docker compose config
