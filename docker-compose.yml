version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader_risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trader_risk_intel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader_risk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader_risk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader_risk_intel}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-trader_risk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader_risk_intel}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENGINE_VERSION: ${ENGINE_VERSION:-1.0.0}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # Migration runner (one-shot)
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trader_risk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader_risk_intel}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-trader_risk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trader_risk_intel}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - internal

volumes:
  pgdata:
    driver: local

networks:
  internal:
    driver: bridge
